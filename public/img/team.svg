<svg viewBox="0 0 520 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Employee directory with privacy levels">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4d65ff"/>
      <stop offset="100%" stop-color="#0082f3"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c212e"/>
      <stop offset="100%" stop-color="#10131b"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="520" height="600" fill="#080a0f"/>
  <ellipse cx="260" cy="300" rx="260" ry="300" fill="#0082f3" opacity="0.12" filter="url(#soft)"/>

  <g transform="translate(60 60)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect width="400" height="480" rx="22" fill="url(#card)" stroke="#e9edef" stroke-opacity="0.1"/>
    <rect width="400" height="6" rx="3" fill="url(#blue)"/>
    <text x="28" y="52" fill="#e9edef" font-size="20" font-weight="700">Team directory</text>
    <text x="28" y="74" fill="#758696" font-size="13">50 people · 3 privacy levels</text>

    <!-- privacy toggles -->
    <g transform="translate(28 96)">
      <rect x="0" y="0" width="104" height="30" rx="15" fill="#0c1610" stroke="#22c07a" stroke-opacity="0.4"/>
      <text x="52" y="20" fill="#22c07a" font-size="12" font-weight="700" text-anchor="middle">transparent</text>
      <rect x="112" y="0" width="92" height="30" rx="15" fill="#161b27" stroke="#e9edef" stroke-opacity="0.14"/>
      <text x="158" y="20" fill="#758696" font-size="12" text-anchor="middle">shielded</text>
      <rect x="212" y="0" width="96" height="30" rx="15" fill="#161b27" stroke="#e9edef" stroke-opacity="0.14"/>
      <text x="260" y="20" fill="#758696" font-size="12" text-anchor="middle">compliant</text>
    </g>

    <!-- people grid 3x3 -->
    <g>
      <!-- row template -->
      <g transform="translate(28 150)">
        <circle cx="22" cy="22" r="18" fill="#161b27" stroke="#4d65ff" stroke-width="1.5"/>
        <text x="22" y="28" fill="#e9edef" font-size="15" font-weight="700" text-anchor="middle">A</text>
        <text x="52" y="18" fill="#e9edef" font-size="14" font-weight="600">Ada Okoye</text>
        <text x="52" y="36" fill="#758696" font-size="11">last paid 28 Oct</text>
      </g>
      <g transform="translate(150 150)">
        <circle cx="22" cy="22" r="18" fill="#161b27" stroke="#0082f3" stroke-width="1.5"/>
        <text x="22" y="28" fill="#e9edef" font-size="15" font-weight="700" text-anchor="middle">M</text>
        <text x="52" y="18" fill="#e9edef" font-size="14" font-weight="600">Marcus Bell</text>
        <text x="52" y="36" fill="#758696" font-size="11">last paid 28 Oct</text>
      </g>
      <g transform="translate(272 150)">
        <circle cx="22" cy="22" r="18" fill="#161b27" stroke="#22c07a" stroke-width="1.5"/>
        <text x="22" y="28" fill="#e9edef" font-size="15" font-weight="700" text-anchor="middle">P</text>
        <text x="52" y="18" fill="#e9edef" font-size="14" font-weight="600">Priya Nair</text>
        <text x="52" y="36" fill="#758696" font-size="11">last paid 28 Oct</text>
      </g>
      <g transform="translate(28 232)">
        <circle cx="22" cy="22" r="18" fill="#161b27" stroke="#e9edef" stroke-opacity="0.2" stroke-width="1.5"/>
        <text x="22" y="28" fill="#e9edef" font-size="15" font-weight="700" text-anchor="middle">J</text>
        <text x="52" y="18" fill="#e9edef" font-size="14" font-weight="600">Jonah Reyes</text>
        <text x="52" y="36" fill="#758696" font-size="11">last paid 28 Oct</text>
      </g>
      <g transform="translate(150 232)">
        <circle cx="22" cy="22" r="18" fill="#161b27" stroke="#4d65ff" stroke-width="1.5"/>
        <text x="22" y="28" fill="#e9edef" font-size="15" font-weight="700" text-anchor="middle">S</text>
        <text x="52" y="18" fill="#e9edef" font-size="14" font-weight="600">Sofia Cruz</text>
        <text x="52" y="36" fill="#758696" font-size="11">last paid 28 Oct</text>
      </g>
      <g transform="translate(272 232)">
        <circle cx="22" cy="22" r="18" fill="#161b27" stroke="#0082f3" stroke-width="1.5"/>
        <text x="22" y="28" fill="#e9edef" font-size="15" font-weight="700" text-anchor="middle">T</text>
        <text x="52" y="18" fill="#e9edef" font-size="14" font-weight="600">Tunde Bak</text>
        <text x="52" y="36" fill="#758696" font-size="11">last paid 28 Oct</text>
      </g>
    </g>

    <!-- audit key -->
    <g transform="translate(28 330)">
      <rect width="344" height="120" rx="14" fill="#0c0f16" stroke="#e9edef" stroke-opacity="0.08"/>
      <circle cx="46" cy="60" r="22" fill="#161b27" stroke="#4d65ff" stroke-width="2"/>
      <path d="M46 46v28M34 60h24" stroke="#4d65ff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="88" y="52" fill="#e9edef" font-size="15" font-weight="700">Audit viewing key</text>
      <text x="88" y="74" fill="#758696" font-size="12">Employers keep a read only key so</text>
      <text x="88" y="92" fill="#758696" font-size="12">every payout is verifiable on chain.</text>
    </g>
  </g>
</svg>
