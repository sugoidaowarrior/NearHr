<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Payroll payout flow from employer to team">
  <defs>
    <radialGradient id="bgGlow" cx="72%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1b2130"/>
      <stop offset="55%" stop-color="#10131b"/>
      <stop offset="100%" stop-color="#080a0f"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4d65ff"/>
      <stop offset="100%" stop-color="#0082f3"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d2230"/>
      <stop offset="100%" stop-color="#12151e"/>
    </linearGradient>
    <linearGradient id="lineG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4d65ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4d65ff"/>
      <stop offset="100%" stop-color="#0082f3" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGlow)"/>

  <!-- faint grid -->
  <g stroke="#e9edef" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 180H1280M0 360H1280M0 540H1280"/>
    <path d="M320 0V720M640 0V720M960 0V720"/>
  </g>

  <!-- glow behind hub -->
  <ellipse cx="360" cy="360" rx="220" ry="220" fill="#4d65ff" opacity="0.16" filter="url(#soft)"/>

  <!-- employer hub card -->
  <g transform="translate(180 250)">
    <rect x="0" y="0" width="320" height="220" rx="20" fill="url(#card)" stroke="#4d65ff" stroke-opacity="0.5"/>
    <rect x="0" y="0" width="320" height="6" rx="3" fill="url(#blue)"/>
    <circle cx="52" cy="66" r="24" fill="none" stroke="#4d65ff" stroke-width="2.5"/>
    <path d="M52 52v28M38 66h28" stroke="#e9edef" stroke-width="2.5" stroke-linecap="round"/>
    <text x="96" y="60" fill="#e9edef" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">Employer</text>
    <text x="96" y="82" fill="#758696" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Vault · roseflinch5</text>
    <rect x="40" y="120" width="240" height="46" rx="10" fill="#0c0f16" stroke="#e9edef" stroke-opacity="0.08"/>
    <text x="56" y="148" fill="#758696" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Payroll run</text>
    <text x="56" y="188" fill="#4d65ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">50 payments ready</text>
    <circle cx="272" cy="183" r="6" fill="#22c07a"/>
  </g>

  <!-- connecting flows -->
  <g fill="none" stroke="url(#lineG)" stroke-width="2.5">
    <path d="M500 300 C 640 300, 640 180, 780 180" opacity="0.9"/>
    <path d="M500 360 C 620 360, 660 360, 780 360" opacity="0.95"/>
    <path d="M500 420 C 640 420, 640 540, 780 540" opacity="0.9"/>
  </g>
  <!-- flow token dots -->
  <circle cx="640" cy="180" r="5" fill="#4d65ff"/>
  <circle cx="640" cy="360" r="6" fill="#0082f3"/>
  <circle cx="640" cy="540" r="5" fill="#4d65ff"/>

  <!-- employee payout cards -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- card 1 -->
    <g transform="translate(780 120)">
      <rect width="380" height="120" rx="16" fill="url(#card)" stroke="#e9edef" stroke-opacity="0.1"/>
      <circle cx="52" cy="60" r="22" fill="#161b27" stroke="#e9edef" stroke-opacity="0.14"/>
      <text x="52" y="66" fill="#e9edef" font-size="18" font-weight="700" text-anchor="middle">A</text>
      <text x="96" y="52" fill="#e9edef" font-size="17" font-weight="600">Ada Okoye</text>
      <text x="96" y="74" fill="#758696" font-size="12">Engineering · ada.near</text>
      <text x="340" y="56" fill="#22c07a" font-size="15" font-weight="700" text-anchor="end">1,500 NEAR</text>
      <text x="340" y="76" fill="#22c07a" font-size="11" text-anchor="end" opacity="0.85">paid</text>
      <path d="M322 44 l6 6 l10 -12" fill="none" stroke="#22c07a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- card 2 -->
    <g transform="translate(780 300)">
      <rect width="380" height="120" rx="16" fill="url(#card)" stroke="#4d65ff" stroke-opacity="0.35"/>
      <circle cx="52" cy="60" r="22" fill="#161b27" stroke="#e9edef" stroke-opacity="0.14"/>
      <text x="52" y="66" fill="#e9edef" font-size="18" font-weight="700" text-anchor="middle">M</text>
      <text x="96" y="52" fill="#e9edef" font-size="17" font-weight="600">Marcus Bell</text>
      <text x="96" y="74" fill="#758696" font-size="12">Product · 0x…8f2a</text>
      <text x="340" y="56" fill="#0082f3" font-size="15" font-weight="700" text-anchor="end">2,400 USDC</text>
      <text x="340" y="76" fill="#758696" font-size="11" text-anchor="end">in transit</text>
      <circle cx="322" cy="48" r="6" fill="#0082f3"/>
    </g>
    <!-- card 3 -->
    <g transform="translate(780 480)">
      <rect width="380" height="120" rx="16" fill="url(#card)" stroke="#e9edef" stroke-opacity="0.1"/>
      <circle cx="52" cy="60" r="22" fill="#161b27" stroke="#e9edef" stroke-opacity="0.14"/>
      <text x="52" y="66" fill="#e9edef" font-size="18" font-weight="700" text-anchor="middle">P</text>
      <text x="96" y="52" fill="#e9edef" font-size="17" font-weight="600">Priya Nair</text>
      <text x="96" y="74" fill="#758696" font-size="12">Design · priya.near</text>
      <text x="340" y="56" fill="#22c07a" font-size="15" font-weight="700" text-anchor="end">1,200 NEAR</text>
      <text x="340" y="76" fill="#22c07a" font-size="11" text-anchor="end" opacity="0.85">paid</text>
      <path d="M322 44 l6 6 l10 -12" fill="none" stroke="#22c07a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- floating token badges -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="700">
    <g transform="translate(120 560)">
      <circle r="26" fill="url(#blue)"/>
      <text y="8" fill="#ffffff" font-size="20" text-anchor="middle">N</text>
    </g>
    <g transform="translate(650 640)">
      <circle r="22" fill="#161b27" stroke="#0082f3" stroke-width="2"/>
      <text y="7" fill="#0082f3" font-size="17" text-anchor="middle">U</text>
    </g>
  </g>
</svg>
