          <circle cx="40" cy="42" r="20" fill="#161b27" stroke="#4ade80" stroke-width="2.4"/>
          <text x="40" y="48" fill="#e9edef" font-size="15" font-weight="700" text-anchor="middle">P</text>
          <circle cx="188" cy="26" r="4" fill="#4ade80"/>
          <text x="24" y="88" fill="#e9edef" font-size="14.5" font-weight="700">Priya Nair</text>
          <text x="24" y="106" fill="#758696" font-size="11">Product Designer</text>
          <line x1="24" y1="118" x2="186" y2="118" stroke="#e9edef" stroke-opacity="0.06"/>
