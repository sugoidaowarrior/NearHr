        <rect width="888" height="110" rx="16" fill="#0f121b" stroke="#22c07a" stroke-opacity="0.25"/>
        <rect x="24" y="30" width="50" height="50" rx="13" fill="#0c1610" stroke="#22c07a" stroke-opacity="0.35"/>
        <path d="M49 42 l10 4 v8 c0 8 -4.5 13 -10 15.5 c-5.5 -2.5 -10 -7.5 -10 -15.5 v-8 z" fill="none" stroke="#22c07a" stroke-width="2"/>
        <path d="M44 62 l4 4 l7 -8" fill="none" stroke="#22c07a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="94" y="52" fill="#e9edef" font-size="16" font-weight="700">Audit viewing key</text>
        <text x="94" y="74" fill="#758696" font-size="12.5">A read only key lets auditors verify stealth payouts on chain.</text>
        <g transform="translate(560 36)">
          <rect width="304" height="38" rx="11" fill="#12151e" stroke="#e9edef" stroke-opacity="0.1"/>
          <text x="16" y="24" fill="#9db8ff" font-size="12.5" font-family="'SF Mono', Menlo, monospace">3f0d90a1…7c520b</text>
          <rect x="230" width="66" height="38" rx="11" fill="url(#nb)"/>
          <text x="263" y="24" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Copy</text>
