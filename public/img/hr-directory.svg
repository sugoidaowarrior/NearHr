          <line x1="24" y1="118" x2="186" y2="118" stroke="#e9edef" stroke-opacity="0.06"/>
          <text x="24" y="137" fill="#758696" font-size="10.5">LAST PAID 28 OCT</text>
        </g>
        <g transform="translate(452 168)">
          <rect width="210" height="150" rx="14" fill="#12151e" stroke="#e9edef" stroke-opacity="0.07"/>
          <circle cx="40" cy="42" r="20" fill="#161b27" stroke="#4ade80" stroke-width="2.4"/>
          <text x="40" y="48" fill="#e9edef" font-size="15" font-weight="700" text-anchor="middle">L</text>
          <circle cx="188" cy="26" r="4" fill="#4ade80"/>
          <text x="24" y="88" fill="#e9edef" font-size="14.5" font-weight="700">Lena Adeyemi</text>
          <text x="24" y="106" fill="#758696" font-size="11">Analyst</text>
          <line x1="24" y1="118" x2="186" y2="118" stroke="#e9edef" stroke-opacity="0.06"/>
          <text x="24" y="137" fill="#758696" font-size="10.5">LAST PAID 28 OCT</text>
        </g>
        <g transform="translate(678 168)">
          <rect width="210" height="150" rx="14" fill="#10131b" stroke="#e9edef" stroke-opacity="0.08" stroke-dasharray="4 5"/>
          <circle cx="105" cy="52" r="20" fill="none" stroke="#e9edef" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 4"/>
          <text x="105" y="120" fill="#5b6474" font-size="12.5" font-weight="600" text-anchor="middle">+ add a person</text>
