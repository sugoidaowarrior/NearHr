<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Team directory: eight people as tiles with privacy rings, filter pills, and an audit viewing key panel">
  <defs>
    <linearGradient id="nb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4d65ff"/>
      <stop offset="100%" stop-color="#0082f3"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171c28"/>
      <stop offset="100%" stop-color="#0f121b"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <rect width="1200" height="760" fill="#0a0d15"/>
  <ellipse cx="600" cy="100" rx="440" ry="200" fill="#4d65ff" opacity="0.12" filter="url(#soft)"/>

