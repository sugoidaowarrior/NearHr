      <text x="36" y="56" fill="#e9edef" font-size="24" font-weight="800">Team directory</text>
      <text x="36" y="80" fill="#758696" font-size="13">50 people · 3 privacy levels</text>
      <g transform="translate(812 30)">
        <rect width="112" height="36" rx="10" fill="url(#nb)"/>
        <text x="56" y="23" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">+ Add person</text>
      </g>

      <!-- filter pills -->
      <g transform="translate(36 104)">
