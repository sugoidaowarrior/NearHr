        <text x="38" y="21" fill="#9db8ff" font-size="12.5" font-weight="700" text-anchor="middle">all · 50</text>
        <rect x="88" width="148" height="32" rx="16" fill="#10131b" stroke="#e9edef" stroke-opacity="0.1"/>
        <circle cx="108" cy="16" r="4.5" fill="#4ade80"/>
        <text x="122" y="21" fill="#98a1b3" font-size="12.5">transparent · 32</text>
        <rect x="248" width="124" height="32" rx="16" fill="#10131b" stroke="#e9edef" stroke-opacity="0.1"/>
        <circle cx="268" cy="16" r="4.5" fill="#60a5fa"/>
        <text x="282" y="21" fill="#98a1b3" font-size="12.5">shielded · 12</text>
        <rect x="384" width="128" height="32" rx="16" fill="#10131b" stroke="#e9edef" stroke-opacity="0.1"/>
        <circle cx="404" cy="16" r="4.5" fill="#d580d0"/>
        <text x="418" y="21" fill="#98a1b3" font-size="12.5">compliant · 6</text>
      </g>

