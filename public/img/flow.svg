<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Payroll in three steps: import, validate, payout">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4d65ff"/>
      <stop offset="100%" stop-color="#0082f3"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c212e"/>
      <stop offset="100%" stop-color="#12151e"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="900" height="420" fill="#0b0d13"/>
  <ellipse cx="450" cy="210" rx="360" ry="180" fill="#4d65ff" opacity="0.10" filter="url(#soft)"/>

  <!-- connector -->
  <path d="M220 150 H680" stroke="#e9edef" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="2 8"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">

    <!-- step 1 -->
    <g transform="translate(70 90)">
      <rect width="220" height="200" rx="18" fill="url(#card)" stroke="#e9edef" stroke-opacity="0.1"/>
      <rect width="220" height="5" rx="2.5" fill="url(#blue)"/>
      <circle cx="44" cy="52" r="20" fill="#161b27" stroke="#4d65ff" stroke-width="2"/>
      <path d="M36 52h16M44 44v16" stroke="#4d65ff" stroke-width="2.4" stroke-linecap="round"/>
      <text x="80" y="48" fill="#758696" font-size="12" font-weight="700" letter-spacing="2">01</text>
      <text x="80" y="66" fill="#e9edef" font-size="17" font-weight="700">Import</text>
      <text x="28" y="112" fill="#758696" font-size="13">Drop a CSV of names,</text>
      <text x="28" y="132" fill="#758696" font-size="13">wallets and pay amounts.</text>
      <rect x="28" y="150" width="164" height="30" rx="8" fill="#0c0f16" stroke="#e9edef" stroke-opacity="0.08"/>
      <text x="40" y="170" fill="#4d65ff" font-size="12" font-family="monospace">team.csv · 50 rows</text>
    </g>

    <!-- step 2 -->
    <g transform="translate(340 90)">
      <rect width="220" height="200" rx="18" fill="url(#card)" stroke="#4d65ff" stroke-opacity="0.5"/>
      <rect width="220" height="5" rx="2.5" fill="url(#blue)"/>
      <circle cx="44" cy="52" r="20" fill="#161b27" stroke="#4d65ff" stroke-width="2"/>
      <path d="M37 52 l5 5 l9 -11" fill="none" stroke="#22c07a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="48" fill="#758696" font-size="12" font-weight="700" letter-spacing="2">02</text>
      <text x="80" y="66" fill="#e9edef" font-size="17" font-weight="700">Validate</text>
      <text x="28" y="112" fill="#758696" font-size="13">Every address is checked</text>
      <text x="28" y="132" fill="#758696" font-size="13">and each total is confirmed.</text>
      <rect x="28" y="150" width="164" height="30" rx="8" fill="#0c0f16" stroke="#22c07a" stroke-opacity="0.3"/>
      <text x="40" y="170" fill="#22c07a" font-size="12" font-family="monospace">50 / 50 valid</text>
    </g>

    <!-- step 3 -->
    <g transform="translate(610 90)">
      <rect width="220" height="200" rx="18" fill="url(#card)" stroke="#e9edef" stroke-opacity="0.1"/>
      <rect width="220" height="5" rx="2.5" fill="url(#blue)"/>
      <circle cx="44" cy="52" r="20" fill="#161b27" stroke="#4d65ff" stroke-width="2"/>
      <path d="M44 40v18M38 52l6 6l6-6" stroke="#4d65ff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="48" fill="#758696" font-size="12" font-weight="700" letter-spacing="2">03</text>
      <text x="80" y="66" fill="#e9edef" font-size="17" font-weight="700">Payout</text>
      <text x="28" y="112" fill="#758696" font-size="13">Batch send NEAR or USDC</text>
      <text x="28" y="132" fill="#758696" font-size="13">to the whole team at once.</text>
      <rect x="28" y="150" width="164" height="30" rx="8" fill="#0c0f16" stroke="#e9edef" stroke-opacity="0.08"/>
      <text x="40" y="170" fill="#4d65ff" font-size="12" font-family="monospace">on NEAR mainnet</text>
    </g>
  </g>
</svg>
