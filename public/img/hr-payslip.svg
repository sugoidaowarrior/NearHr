<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Automated payslip: Ada Okoye, November, base plus bonus in NEAR, net paid in Naira, onchain receipt">
  <defs>
    <linearGradient id="nb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4d65ff"/>
      <stop offset="100%" stop-color="#0082f3"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171c28"/>
      <stop offset="100%" stop-color="#0f121b"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <rect width="1200" height="760" fill="#0a0d15"/>
  <ellipse cx="600" cy="120" rx="420" ry="200" fill="#4d65ff" opacity="0.12" filter="url(#soft)"/>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- ===== payslip document (center) ===== -->
    <g transform="translate(430 56)">
      <rect width="420" height="648" rx="22" fill="url(#card)" stroke="#e9edef" stroke-opacity="0.1"/>
      <rect width="420" height="8" rx="4" fill="url(#nb)"/>

      <!-- header -->
      <rect x="28" y="34" width="30" height="30" rx="8" fill="url(#nb)"/>
      <text x="43" y="54" fill="#fff" font-size="16" font-weight="800" text-anchor="middle">N</text>
      <text x="68" y="48" fill="#e9edef" font-size="14" font-weight="700">NearHr Payslip</text>
      <text x="68" y="64" fill="#758696" font-size="11.5">November 2026 · cycle 11</text>
      <rect x="300" y="38" width="92" height="26" rx="13" fill="#0c1610" stroke="#22c07a" stroke-opacity="0.4"/>
      <circle cx="316" cy="51" r="4" fill="#22c07a"/>
      <text x="326" y="55" fill="#22c07a" font-size="11" font-weight="700">settled</text>

      <!-- employee -->
      <g transform="translate(28 92)">
        <circle cx="24" cy="24" r="22" fill="#161b27" stroke="#4ade80" stroke-width="1.8"/>
        <text x="24" y="30" fill="#e9edef" font-size="16" font-weight="700" text-anchor="middle">A</text>
        <text x="58" y="20" fill="#e9edef" font-size="16" font-weight="700">Ada Okoye</text>
        <text x="58" y="38" fill="#758696" font-size="11.5">ada.near · Frontend Engineer</text>
        <text x="58" y="53" fill="#5b6474" font-size="10.5">payday · 28 Nov 2026</text>
      </g>
      <line x1="28" y1="168" x2="392" y2="168" stroke="#e9edef" stroke-opacity="0.08"/>

      <!-- earnings rows -->
      <g transform="translate(28 192)">
        <text x="0" y="0" fill="#758696" font-size="11" font-weight="700" letter-spacing="1.5">EARNINGS</text>
      </g>
      <g transform="translate(28 214)">
        <text x="0" y="14" fill="#e9edef" font-size="13.5">Base salary</text>
        <text x="336" y="14" fill="#e9edef" font-size="13.5" font-weight="700" text-anchor="end">₦172,000</text>
        <text x="336" y="30" fill="#5b6474" font-size="10.5" text-anchor="end">128.4 NEAR</text>
        <line x1="0" y1="44" x2="336" y2="44" stroke="#e9edef" stroke-opacity="0.06"/>
      </g>
      <g transform="translate(28 266)">
        <text x="0" y="14" fill="#e9edef" font-size="13.5">Performance bonus</text>
        <text x="336" y="14" fill="#22c07a" font-size="13.5" font-weight="700" text-anchor="end">₦14,000</text>
        <text x="336" y="30" fill="#5b6474" font-size="10.5" text-anchor="end">10.4 USDC.e</text>
        <line x1="0" y1="44" x2="336" y2="44" stroke="#e9edef" stroke-opacity="0.06"/>
      </g>
      <g transform="translate(28 318)">
        <text x="0" y="14" fill="#e9edef" font-size="13.5">Reimbursement</text>
        <text x="336" y="14" fill="#e9edef" font-size="13.5" font-weight="700" text-anchor="end">₦8,000</text>
        <line x1="0" y1="44" x2="336" y2="44" stroke="#e9edef" stroke-opacity="0.06"/>
      </g>
      <g transform="translate(28 370)">
        <rect width="336" height="44" rx="12" fill="#12151e" stroke="#4d65ff" stroke-opacity="0.35"/>
        <text x="16" y="28" fill="#758696" font-size="12.5">Gross pay</text>
        <text x="320" y="28" fill="#e9edef" font-size="16" font-weight="800" text-anchor="end">₦194,000</text>
      </g>

      <!-- net card -->
      <g transform="translate(28 436)">
        <rect width="336" height="120" rx="16" fill="url(#nb)"/>
        <ellipse cx="300" cy="0" rx="140" ry="80" fill="#8f7bff" opacity="0.4" filter="url(#soft)"/>
        <text x="22" y="34" fill="#ffffff" opacity="0.85" font-size="11.5" font-weight="700" letter-spacing="1.5">NET PAID · 28 NOV</text>
        <text x="22" y="74" fill="#ffffff" font-size="30" font-weight="800" letter-spacing="-0.5">₦194,000</text>
        <text x="22" y="98" fill="#ffffff" opacity="0.85" font-size="12">143.9 NEAR + 10.4 USDC.e · 2 transfers</text>
        <rect x="234" y="52" width="82" height="34" rx="10" fill="#ffffff" opacity="0.16"/>
        <path d="M248 69 l5 5 l10 -11" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="262" y="74" fill="#fff" font-size="11.5" font-weight="700">Paid</text>
      </g>

      <!-- onchain receipt -->
      <g transform="translate(28 580)">
        <rect width="336" height="40" rx="11" fill="#0f121b" stroke="#e9edef" stroke-opacity="0.08"/>
        <circle cx="24" cy="20" r="7" fill="none" stroke="#22c07a" stroke-width="1.8"/>
        <path d="M20 20 l3 3 l5 -6" fill="none" stroke="#22c07a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="42" y="24" fill="#758696" font-size="11">Receipt on NEAR mainnet</text>
        <text x="320" y="24" fill="#4d65ff" font-size="11" font-weight="700" text-anchor="end" font-family="'SF Mono', Menlo, monospace">0x9a41…c7e2</text>
      </g>
    </g>

    <!-- ===== floating: multi currency chip (left) ===== -->
    <g transform="translate(96 200)">
      <rect width="250" height="120" rx="16" fill="#12151e" stroke="#e9edef" stroke-opacity="0.1"/>
      <text x="22" y="32" fill="#e9edef" font-size="14" font-weight="700">Multi currency pay</text>
      <text x="22" y="50" fill="#758696" font-size="11">one salary, three ways in</text>
      <g transform="translate(22 68)">
        <rect width="68" height="30" rx="15" fill="#161b27"/>
        <text x="34" y="20" fill="#9db8ff" font-size="11.5" font-weight="700" text-anchor="middle">₦ NGN</text>
        <rect x="78" width="68" height="30" rx="15" fill="#161b27"/>
        <text x="112" y="20" fill="#8fd3ff" font-size="11.5" font-weight="700" text-anchor="middle">$ USD</text>
        <rect x="156" width="68" height="30" rx="15" fill="#161b27"/>
        <text x="190" y="20" fill="#9db8ff" font-size="11.5" font-weight="700" text-anchor="middle">NEAR</text>
      </g>
    </g>

    <!-- ===== floating: split payroll chip (left, lower) ===== -->
    <g transform="translate(76 420)">
      <rect width="272" height="150" rx="16" fill="#12151e" stroke="#e9edef" stroke-opacity="0.1"/>
      <text x="22" y="32" fill="#e9edef" font-size="14" font-weight="700">Split payroll</text>
      <text x="22" y="50" fill="#758696" font-size="11">one pay, two accounts, zero fees</text>
      <g transform="translate(22 70)">
        <rect width="228" height="16" rx="8" fill="#1c212e"/>
        <rect width="140" height="16" rx="8" fill="url(#nb)"/>
        <text x="20" y="40" fill="#9db8ff" font-size="10.5" font-weight="700">salary · 60%</text>
        <text x="20" y="62" fill="#9db8ff" font-size="10.5" font-weight="700" text-anchor="start">₦116,400</text>
        <text x="226" y="40" fill="#758696" font-size="10.5" font-weight="700" text-anchor="end">rent · 40%</text>
        <text x="226" y="62" fill="#758696" font-size="10.5" font-weight="700" text-anchor="end">₦77,600</text>
      </g>
    </g>

    <!-- ===== floating: schedule chip (right) ===== -->
    <g transform="translate(918 240)">
      <rect width="212" height="120" rx="16" fill="#12151e" stroke="#e9edef" stroke-opacity="0.1"/>
      <text x="22" y="32" fill="#e9edef" font-size="14" font-weight="700">Custom schedule</text>
      <g transform="translate(22 52)">
        <rect width="48" height="40" rx="8" fill="#161b27" stroke="#4d65ff" stroke-opacity="0.45"/>
        <text x="24" y="16" fill="#9db8ff" font-size="9.5" font-weight="700" text-anchor="middle">MONTHLY</text>
        <text x="24" y="32" fill="#e9edef" font-size="12" font-weight="800" text-anchor="middle">28</text>
        <rect x="56" width="48" height="40" rx="8" fill="#161b27"/>
        <text x="80" y="16" fill="#758696" font-size="9.5" font-weight="700" text-anchor="middle">BI WEEK</text>
        <text x="80" y="32" fill="#758696" font-size="12" font-weight="800" text-anchor="middle">15</text>
        <rect x="112" width="48" height="40" rx="8" fill="#161b27"/>
        <text x="136" y="16" fill="#758696" font-size="9.5" font-weight="700" text-anchor="middle">ONE OFF</text>
        <text x="136" y="32" fill="#758696" font-size="12" font-weight="800" text-anchor="middle">+</text>
      </g>
    </g>

    <!-- ===== floating: on-time badge (right, lower) ===== -->
    <g transform="translate(930 470)">
      <rect width="192" height="92" rx="16" fill="#12151e" stroke="#22c07a" stroke-opacity="0.35"/>
      <circle cx="40" cy="46" r="20" fill="#0c1610"/>
      <path d="M31 46 l6 6 l11 -13" fill="none" stroke="#22c07a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="72" y="42" fill="#e9edef" font-size="14" font-weight="700">Paid on time</text>
      <text x="72" y="60" fill="#758696" font-size="11">14 cycles in a row</text>
    </g>
  </g>
</svg>
