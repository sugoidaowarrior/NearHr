        <!-- May -->
        <rect x="66"  y="216" width="26" height="112" rx="5" fill="url(#barLight)"/>
        <rect x="96"  y="196" width="26" height="132" rx="5" fill="url(#barDark)"/>
        <!-- Jun -->
        <rect x="166" y="192" width="26" height="136" rx="5" fill="url(#barLight)"/>
        <rect x="196" y="170" width="26" height="158" rx="5" fill="url(#barDark)"/>
        <!-- Jul -->
        <rect x="266" y="204" width="26" height="124" rx="5" fill="url(#barLight)"/>
        <rect x="296" y="180" width="26" height="148" rx="5" fill="url(#barDark)"/>
        <!-- Aug -->
        <rect x="366" y="168" width="26" height="160" rx="5" fill="url(#barLight)"/>
        <rect x="396" y="142" width="26" height="186" rx="5" fill="url(#barDark)"/>
        <!-- Sep -->
        <rect x="466" y="150" width="26" height="178" rx="5" fill="url(#barLight)"/>
        <rect x="496" y="126" width="26" height="202" rx="5" fill="url(#barDark)"/>
        <!-- Oct (current, highlighted) -->
        <rect x="566" y="118" width="26" height="210" rx="5" fill="url(#barLight)"/>
        <rect x="596" y="98"  width="26" height="230" rx="5" fill="url(#barDark)"/>
        <rect x="560" y="90" width="68" height="248" rx="10" fill="none" stroke="#4d65ff" stroke-opacity="0.5"/>
      </g>
      <g fill="#758696" font-size="11" text-anchor="middle">
