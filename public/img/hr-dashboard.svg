<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NearHr dashboard: next payroll, total salary in Naira, salary history chart and payout table">
  <defs>
    <linearGradient id="nb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4d65ff"/>
      <stop offset="100%" stop-color="#0082f3"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171c28"/>
      <stop offset="100%" stop-color="#0f121b"/>
    </linearGradient>
    <linearGradient id="barLight" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7d9bff"/>
      <stop offset="100%" stop-color="#9db8ff"/>
    </linearGradient>
    <linearGradient id="barDark" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#3d4557"/>
      <stop offset="100%" stop-color="#5b6474"/>
    </linearGradient>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0d15"/>
      <stop offset="100%" stop-color="#0d1019"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="1200" height="760" fill="url(#heroBg)"/>
  <ellipse cx="330" cy="120" rx="380" ry="220" fill="#4d65ff" opacity="0.14" filter="url(#soft)"/>
  <ellipse cx="1000" cy="680" rx="360" ry="220" fill="#0082f3" opacity="0.10" filter="url(#soft)"/>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- ===== app frame ===== -->
    <rect x="40" y="36" width="1120" height="688" rx="24" fill="url(#card)" stroke="#e9edef" stroke-opacity="0.10"/>
    <line x1="40" y1="84" x2="1160" y2="84" stroke="#e9edef" stroke-opacity="0.07"/>

    <!-- top bar -->
    <rect x="64" y="50" width="26" height="26" rx="7" fill="url(#nb)"/>
    <text x="77" y="68" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">N</text>
    <text x="100" y="68" fill="#e9edef" font-size="14" font-weight="700">NearHr</text>
    <rect x="930" y="50" width="206" height="28" rx="14" fill="#0c0f16" stroke="#e9edef" stroke-opacity="0.10"/>
    <circle cx="948" cy="64" r="5" fill="none" stroke="#758696" stroke-width="1.6"/>
    <line x1="951.5" y1="67.5" x2="956" y2="72" stroke="#758696" stroke-width="1.6" stroke-linecap="round"/>
    <text x="966" y="68" fill="#758696" font-size="12">Search your team</text>
    <circle cx="1122" cy="64" r="12" fill="#161b27" stroke="#4d65ff" stroke-width="1.4"/>
    <text x="1122" y="68" fill="#9db8ff" font-size="11" font-weight="700" text-anchor="middle">BO</text>

    <!-- ===== left hero: next payroll (blue gradient) ===== -->
    <g transform="translate(64 108)">
      <rect width="330" height="180" rx="18" fill="url(#nb)"/>
      <ellipse cx="300" cy="0" rx="150" ry="90" fill="#8f7bff" opacity="0.35" filter="url(#glow)"/>
      <rect x="26" y="24" width="34" height="34" rx="10" fill="#ffffff" opacity="0.16"/>
      <rect x="33" y="33" width="20" height="17" rx="3" fill="none" stroke="#ffffff" stroke-width="1.8"/>
      <line x1="33" y1="38" x2="53" y2="38" stroke="#ffffff" stroke-width="1.8"/>
      <line x1="38" y1="30" x2="38" y2="35" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="48" y1="30" x2="48" y2="35" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      <text x="72" y="40" fill="#ffffff" opacity="0.85" font-size="12" font-weight="600" letter-spacing="1.5">NEXT PAYROLL</text>
      <text x="72" y="58" fill="#ffffff" font-size="17" font-weight="700">Tuesday, 24 November</text>
      <text x="26" y="106" fill="#ffffff" font-size="13" opacity="0.9">50 people · ₦12,480,000</text>
      <text x="26" y="128" fill="#ffffff" opacity="0.75" font-size="12">Runs automatically · NEAR + USDC.e</text>
      <rect x="26" y="146" width="150" height="30" rx="15" fill="#ffffff" opacity="0.18"/>
      <path d="M40 161 l5 5 l9 -10" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="58" y="166" fill="#ffffff" font-size="12" font-weight="700">Ready to run</text>
    </g>

    <!-- ===== right hero: total salary (white card) ===== -->
    <g transform="translate(414 108)">
      <rect width="330" height="180" rx="18" fill="#f4f6fb"/>
      <rect x="26" y="24" width="34" height="34" rx="10" fill="#e8edfb"/>
      <circle cx="43" cy="41" r="10" fill="none" stroke="#4d65ff" stroke-width="1.8"/>
      <text x="43" y="45" fill="#4d65ff" font-size="11" font-weight="800" text-anchor="middle">₦</text>
      <text x="72" y="40" fill="#5b6474" font-size="12" font-weight="700" letter-spacing="1.5">TOTAL SALARY · NOV</text>
      <text x="72" y="58" fill="#5b6474" font-size="13">paid out this month</text>
      <text x="26" y="112" fill="#141824" font-size="34" font-weight="800" letter-spacing="-0.5">₦12,480,000</text>
      <rect x="26" y="132" width="120" height="26" rx="13" fill="#e7f6ee"/>
      <circle cx="40" cy="145" r="4" fill="#1fae6a"/>
      <text x="50" y="149" fill="#177a4b" font-size="11.5" font-weight="700">100% disbursed</text>
      <text x="304" y="150" fill="#5b6474" font-size="12" text-anchor="end">50 of 50 paid</text>
    </g>

    <!-- ===== salary history chart ===== -->
    <g transform="translate(64 312)">
      <rect width="676" height="392" rx="18" fill="#12151e" stroke="#e9edef" stroke-opacity="0.07"/>
      <text x="28" y="40" fill="#e9edef" font-size="17" font-weight="700">Salary history</text>
      <text x="28" y="60" fill="#758696" font-size="12">Last 6 paydays · Naira</text>
      <g transform="translate(700 28)">
        <rect width="40" height="16" rx="8" fill="#1b2130"/>
        <text x="20" y="12" fill="#9db8ff" font-size="10" font-weight="700" text-anchor="middle">paid</text>
        <rect x="-56" y="20" width="40" height="16" rx="8" fill="#262c3a"/>
        <text x="-36" y="32" fill="#98a1b3" font-size="10" font-weight="700" text-anchor="middle">total</text>
      </g>

      <!-- grid + axis -->
      <g stroke="#e9edef" stroke-opacity="0.06">
        <line x1="28" y1="100" x2="648" y2="100"/>
        <line x1="28" y1="176" x2="648" y2="176"/>
        <line x1="28" y1="252" x2="648" y2="252"/>
        <line x1="28" y1="328" x2="648" y2="328"/>
      </g>
      <g fill="#5b6474" font-size="10" font-family="'SF Mono', Menlo, monospace">
        <text x="20" y="104" text-anchor="end">12M</text>
        <text x="20" y="180" text-anchor="end">9M</text>
        <text x="20" y="256" text-anchor="end">6M</text>
        <text x="20" y="332" text-anchor="end">3M</text>
      </g>
      <line x1="28" y1="328" x2="648" y2="328" stroke="#e9edef" stroke-opacity="0.14"/>

      <!-- bars: pairs of (disbursed light, total dark), 6 months -->
