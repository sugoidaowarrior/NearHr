      <g transform="translate(548 52)">
        <rect width="118" height="34" rx="9" fill="#0c0f16" stroke="#4d65ff" stroke-opacity="0.45"/>
        <text x="12" y="15" fill="#758696" font-size="10">Oct disbursed</text>
        <text x="12" y="29" fill="#e9edef" font-size="12.5" font-weight="700">₦12,480,000</text>
      </g>
      <line x1="607" y1="86" x2="607" y2="118" stroke="#4d65ff" stroke-opacity="0.5" stroke-dasharray="3 4"/>
    </g>

    <!-- ===== payout table (right) ===== -->
    <g transform="translate(764 312)">
      <rect width="372" height="392" rx="18" fill="#12151e" stroke="#e9edef" stroke-opacity="0.07"/>
      <text x="24" y="40" fill="#e9edef" font-size="17" font-weight="700">Recent payouts</text>
      <rect x="272" y="22" width="76" height="24" rx="12" fill="#0c1610" stroke="#22c07a" stroke-opacity="0.4"/>
      <circle cx="286" cy="34" r="4" fill="#22c07a"/>
      <text x="296" y="38" fill="#22c07a" font-size="11" font-weight="700">live</text>

      <g transform="translate(24 72)">
        <circle cx="16" cy="16" r="16" fill="#161b27" stroke="#4ade80" stroke-width="1.6"/>
        <text x="16" y="21" fill="#e9edef" font-size="12" font-weight="700" text-anchor="middle">A</text>
        <text x="44" y="13" fill="#e9edef" font-size="13" font-weight="600">Ada Okoye</text>
        <text x="44" y="29" fill="#758696" font-size="10.5">ada.near · engineering</text>
        <text x="324" y="13" fill="#e9edef" font-size="12.5" font-weight="700" text-anchor="end">₦186,000</text>
        <rect x="252" y="19" width="72" height="18" rx="9" fill="#161b27"/>
        <text x="288" y="31" fill="#9db8ff" font-size="10" font-weight="700" text-anchor="middle">NEAR</text>
        <line x1="0" y1="46" x2="324" y2="46" stroke="#e9edef" stroke-opacity="0.06"/>
      </g>
      <g transform="translate(24 140)">
        <circle cx="16" cy="16" r="16" fill="#161b27" stroke="#60a5fa" stroke-width="1.6"/>
        <text x="16" y="21" fill="#e9edef" font-size="12" font-weight="700" text-anchor="middle">M</text>
        <text x="44" y="13" fill="#e9edef" font-size="13" font-weight="600">Marcus Bell</text>
        <text x="44" y="29" fill="#758696" font-size="10.5">0x…8f2a · product</text>
        <text x="324" y="13" fill="#e9edef" font-size="12.5" font-weight="700" text-anchor="end">₦248,000</text>
        <rect x="252" y="19" width="72" height="18" rx="9" fill="#161b27"/>
        <text x="288" y="31" fill="#8fd3ff" font-size="10" font-weight="700" text-anchor="middle">USDC.e</text>
        <line x1="0" y1="46" x2="324" y2="46" stroke="#e9edef" stroke-opacity="0.06"/>
      </g>
      <g transform="translate(24 208)">
        <circle cx="16" cy="16" r="16" fill="#161b27" stroke="#d580d0" stroke-width="1.6"/>
        <text x="16" y="21" fill="#e9edef" font-size="12" font-weight="700" text-anchor="middle">P</text>
        <text x="44" y="13" fill="#e9edef" font-size="13" font-weight="600">Priya Nair</text>
        <text x="44" y="29" fill="#758696" font-size="10.5">priya.near · design</text>
        <text x="324" y="13" fill="#e9edef" font-size="12.5" font-weight="700" text-anchor="end">₦172,000</text>
        <rect x="252" y="19" width="72" height="18" rx="9" fill="#161b27"/>
        <text x="288" y="31" fill="#9db8ff" font-size="10" font-weight="700" text-anchor="middle">NEAR</text>
        <line x1="0" y1="46" x2="324" y2="46" stroke="#e9edef" stroke-opacity="0.06"/>
      </g>
      <g transform="translate(24 276)">
        <circle cx="16" cy="16" r="16" fill="#161b27" stroke="#4ade80" stroke-width="1.6"/>
        <text x="16" y="21" fill="#e9edef" font-size="12" font-weight="700" text-anchor="middle">J</text>
        <text x="44" y="13" fill="#e9edef" font-size="13" font-weight="600">Jonah Reyes</text>
        <text x="44" y="29" fill="#758696" font-size="10.5">jonah.near · ops</text>
        <text x="324" y="13" fill="#e9edef" font-size="12.5" font-weight="700" text-anchor="end">₦143,000</text>
        <rect x="252" y="19" width="72" height="18" rx="9" fill="#161b27"/>
        <text x="288" y="31" fill="#8fd3ff" font-size="10" font-weight="700" text-anchor="middle">USDC.e</text>
      </g>
      <rect x="24" y="340" width="324" height="34" rx="10" fill="#0c0f16" stroke="#4d65ff" stroke-opacity="0.3"/>
      <text x="40" y="362" fill="#758696" font-size="11.5">46 more paid this run</text>
      <text x="332" y="362" fill="#22c07a" font-size="12" font-weight="700" text-anchor="end">All settled ✓</text>
    </g>
  </g>

  <!-- floating chips (HTML overlays sit on top of this in the hero) -->
</svg>
