        <text x="194" y="352">Jun</text>
        <text x="294" y="352">Jul</text>
        <text x="394" y="352">Aug</text>
        <text x="494" y="352">Sep</text>
        <text x="594" y="352" fill="#9db8ff" font-weight="700">Oct</text>
      </g>
