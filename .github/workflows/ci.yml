name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Production build (includes type check)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Test suite (98 tests)
        run: npm test
